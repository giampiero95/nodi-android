name: Build Nodi APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "src/**"
      - "package.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/build-apk.yml"

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepara Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager non trovato"
            exit 1
          fi
          echo "Uso $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Dipendenze
        run: npm install

      - name: Controllo TypeScript
        run: npm run typecheck

      - name: Genera progetto Android
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Compila APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: Nodi-Android-Fase1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
